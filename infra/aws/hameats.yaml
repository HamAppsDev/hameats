AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  HamEats on AWS, sized to stay inside AWS's always-free allowances: the app on Lambda behind CloudFront, favorites
  in DynamoDB (provisioned 5/5, inside the free 25/25), secrets in Parameter Store, the daily alerts on EventBridge
  Scheduler (every 15 minutes) and Amazon SES (alert emails), and a role GitHub Actions uses to deploy. Deploy in us-east-2 (the project's Region). Steps: infra/aws/README.md.

Parameters:
  AlertEmail:
    Type: String
    Default: hamappsdevs@gmail.com
    Description: Gets an email when the app errors or the daily alerts fail (confirm the subscription email once).
  VapidPublicKey:
    Type: String
    Description: NEXT_PUBLIC_VAPID_PUBLIC_KEY, the same value as on Vercel (not secret).
  CreateTable:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Create the DynamoDB table. Set false if you already made it by hand.
  TableName:
    Type: String
    Default: hameats-users
  CertificateArn:
    Type: String
    Default: ""
    Description: >-
      An ACM certificate in us-east-1 for DomainNames. Leave empty at first: the site then answers on its
      *.cloudfront.net address only.
  DomainNames:
    Type: CommaDelimitedList
    Default: "www.hameats.app,hameats.app"
    Description: The addresses CloudFront answers on once CertificateArn is set.
  GitHubRepo:
    Type: String
    Default: HamAppsDev/hameats
    Description: owner/name of the repository whose main branch may deploy.
  GitHubSubPrefix:
    Type: String
    Default: repo:HamAppsDev@359968926/hameats@1384249387
    Description: >-
      The same repository as GitHub now names it in its sign-in tokens (owner@id/name@id; see
      `gh api repos/OWNER/NAME/actions/oidc/customization/sub`). Accepted along with the plain owner/name form.
  AlertEmailFrom:
    Type: String
    Default: notifications@hameats.app
    Description: >-
      The address alert emails come from (lib/email.ts). Its domain must be a verified SES identity in this Region;
      the app may send only from this address.
  EmailAlerts:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: >-
      Offer alert emails. Leave false until SES shows AlertEmailFrom's domain as verified: while false the app hides
      the Email switch and sends no email.
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set false if this AWS account already has the token.actions.githubusercontent.com identity provider.

Conditions:
  WithTable: !Equals [!Ref CreateTable, "true"]
  WithDomain: !Not [!Equals [!Ref CertificateArn, ""]]
  WithOidcProvider: !Equals [!Ref CreateGitHubOidcProvider, "true"]
  WithEmailAlerts: !Equals [!Ref EmailAlerts, "true"]

Resources:
  # ---- Data: one item per person (lib/users.ts). 5 reads and 5 writes a second is far more than HamEats needs and
  # inside the always-free 25/25; on-demand mode would bill per request instead. Kept if the stack is deleted.
  UsersTable:
    Type: AWS::DynamoDB::Table
    Condition: WithTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH

  # ---- The app. GitHub Actions replaces the code on every push to main; this placeholder only answers until then.
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: hameats-app
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem, dynamodb:Scan]
                Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}
              # The settings in Parameter Store under /hameats (README step 1), read when the function starts.
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/hameats
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
              # Alert emails (lib/email.ts), only from AlertEmailFrom.
              - Effect: Allow
                Action: ses:SendEmail
                Resource: !Sub
                  - arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${Domain}
                  - Domain: !Select [1, !Split ["@", !Ref AlertEmailFrom]]
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref AlertEmailFrom

  AppLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/hameats
      RetentionInDays: 14

  App:
    Type: AWS::Lambda::Function
    DependsOn: AppLogs
    Properties:
      FunctionName: hameats
      Description: HamEats (Next.js standalone server; web/lambda/index.mjs)
      Runtime: nodejs22.x
      Architectures: [x86_64]
      Handler: index.handler
      MemorySize: 1024
      Timeout: 30
      Role: !GetAtt AppRole.Arn
      Environment:
        Variables:
          SSM_PREFIX: /hameats
          HAMEATS_DYNAMODB_TABLE: !Ref TableName
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          HAMEATS_EMAIL_FROM: !If [WithEmailAlerts, !Sub "HamEats <${AlertEmailFrom}>", !Ref AWS::NoValue]
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, headers: { "content-type": "text/plain" }, body: "HamEats isn't deployed yet." });

  AppUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref App
      AuthType: NONE

  # Anyone may call the function URL (CloudFront does, with the ORIGIN_VERIFY header the handler checks).
  AppUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref App
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AppUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref App
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ---- CloudFront: HTTPS, the hameats.app addresses, and caching of the static files. Most pages aren't cached here:
  # they come from the function each time (Next.js caches them itself). The exceptions are the pages and icons that are
  # the same for everyone (SharedPagePaths below) and the home page (HomePageCachePolicy): caching those keeps a single page load from starting ~16 copies of
  # the function at once, which ran into the account's concurrency limit. The deploy workflow clears them after each
  # deploy, so a new version shows up straight away.

  # About, Privacy and Terms: kept as long as the page itself allows (Next.js marks them cacheable), up to an hour.
  # MinTTL 0 means that if one of them ever starts showing something personal (Next.js then sends no-store), CloudFront
  # stops caching it by itself. The rsc/_rsc parts of the key keep the HTML page and the in-app version apart.
  SharedPagesCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: hameats-shared-pages
        Comment: HamEats pages that are the same for everyone.
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [RSC, Next-Router-Prefetch, Next-Router-State-Tree, Next-Router-Segment-Prefetch]

  # The home page: the same for everyone (menus only; sign-in and favorites load afterwards in the browser). The Lambda
  # handler marks it s-maxage=86400 and the scheduled menu refreshes (MenuRefreshHourly/Quarters) clear it, so it's made
  # about 17 times a day instead of on every visit. MinTTL 0: an answer marked no-store (e.g. an error) isn't kept.
  HomePageCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: hameats-home-page
        Comment: The HamEats home page, kept until the next scheduled menu refresh.
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [RSC, Next-Router-Prefetch, Next-Router-State-Tree, Next-Router-Segment-Prefetch]

  # Icons and the app manifest: Next.js tells browsers to re-check them every time (max-age=0), so the edge keeps them
  # for an hour regardless. They never contain anything personal.
  IconsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: hameats-icons
        Comment: HamEats icons and manifest, the same for everyone.
        MinTTL: 3600
        DefaultTTL: 3600
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig: { HeaderBehavior: none }
  ForwardedHost:
    Type: AWS::CloudFront::Function
    Properties:
      Name: hameats-forwarded-host
      AutoPublish: true
      FunctionConfig:
        Comment: Tells the app which address the visitor used (CloudFront replaces Host with the function URL's).
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var req = event.request;
          req.headers["x-forwarded-host"] = { value: req.headers.host.value };
          return req;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HamEats
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Aliases: !If [WithDomain, !Ref DomainNames, !Ref AWS::NoValue]
        ViewerCertificate: !If
          - WithDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: app
            DomainName: !Select [2, !Split ["/", !GetAtt AppUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: "{{resolve:ssm:/hameats/ORIGIN_VERIFY}}"
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
        CacheBehaviors:
          # Files whose names change with every build: cache them at the edge, so most visits barely touch Lambda.
          - PathPattern: /_next/static/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          # The home page only (not /api, /hours...): see HomePageCachePolicy.
          - PathPattern: /
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref HomePageCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          # Pages and icons that are the same for everyone (see SharedPagesCachePolicy / IconsCachePolicy).
          - PathPattern: /about
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref SharedPagesCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /privacy
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref SharedPagesCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /terms
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref SharedPagesCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /icon.png
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref IconsCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /apple-icon.png
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref IconsCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /favicon.ico
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref IconsCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /manifest.webmanifest
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref IconsCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN
          - PathPattern: /icons/*
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            CachePolicyId: !Ref IconsCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ForwardedHost.FunctionMetadata.FunctionARN

  # ---- The daily alerts: EventBridge Scheduler invokes the function every 15 minutes, campus time, all year; each run
  # sends to the people whose picked time has come (app/api/cron/alerts/route.ts). About 2,900 runs a month, inside the
  # free 14 million Scheduler invocations and 1 million Lambda requests.
  AlertsSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-hameats
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt App.Arn

  AlertsSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: hameats-morning-alert
      Description: The daily favorites alerts, every 15 minutes (app/api/cron/alerts/route.ts)
      ScheduleExpression: cron(0/15 * * * ? *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt App.Arn
        RoleArn: !GetAtt AlertsSchedulerRole.Arn
        Input: '{"hameats":"alerts"}'
        RetryPolicy:
          MaximumRetryAttempts: 2

  # ---- Menu refresh: at these campus times the function fetches the menus and, if dishes came back, clears CloudFront's
  # copy of the home page (web/lambda/index.mjs refreshMenus). Between them every visitor gets the same stored page.
  # 9:00-7:00 on the hour, plus 10:15/10:30/10:45 and 4:15/4:30/4:45. About 17 invalidations a day, inside the free
  # 1,000 paths a month along with the deploys'.
  MenuRefreshHourly:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: hameats-menu-refresh-hourly
      Description: Refresh the home page menus on the hour, 9 AM to 7 PM campus time.
      ScheduleExpression: cron(0 9-19 * * ? *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt App.Arn
        RoleArn: !GetAtt AlertsSchedulerRole.Arn
        Input: '{"hameats":"refresh-menus"}'
        RetryPolicy:
          MaximumRetryAttempts: 1

  MenuRefreshQuarters:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: hameats-menu-refresh-quarters
      Description: Refresh the home page menus at 10:15, 10:30, 10:45, 4:15, 4:30 and 4:45 campus time.
      ScheduleExpression: cron(15,30,45 10,16 * * ? *)
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt App.Arn
        RoleArn: !GetAtt AlertsSchedulerRole.Arn
        Input: '{"hameats":"refresh-menus"}'
        RetryPolicy:
          MaximumRetryAttempts: 1

  # The function clears the home page itself after a refresh. A separate policy (and the distribution ID in Parameter
  # Store, read when the function starts) avoids a loop: the distribution already depends on the function.
  AppInvalidatePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: hameats-clear-home-page
      Roles: [!Ref AppRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  DistributionIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /hameats/CLOUDFRONT_DISTRIBUTION_ID
      Type: String
      Value: !Ref Distribution
      Description: Read by the HamEats function at start-up, for the menu refresh.

  # ---- GitHub Actions (.github/workflows/deploy-aws.yml) signs in with this role, from main only, to replace the code.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: WithOidcProvider
    # Kept if this stack is ever deleted: the Hamilton Scheduler and homepage deploy roles use it too.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - WithOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub ${GitHubSubPrefix}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-hameats
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt App.Arn
              # Clear the cached shared pages and icons after a deploy.
              - Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  # ---- Problem emails: the app erroring, and an alerts run not succeeding. Inside the always-free 10 alarms and
  # 1,000 SNS emails a month. AWS sends a one-time "confirm subscription" email to AlertEmail first.
  ProblemsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: hameats-problems
      DisplayName: HamEats

  ProblemsEmail:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ProblemsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  AppErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: hameats-app-errors
      AlarmDescription: The HamEats function crashed, timed out or was throttled. Logs are in /aws/lambda/hameats.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref App
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ProblemsTopic]
      OKActions: [!Ref ProblemsTopic]

  AppThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: hameats-app-throttles
      AlarmDescription: Requests to the HamEats function were refused because too many ran at once.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref App
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ProblemsTopic]

  # web/lambda/index.mjs logs "alerts: <status> <result>" for every scheduled run. Anything but a 200 counts.
  AlertsFailedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogs
      FilterPattern: '"alerts:" -"alerts: 200"'
      MetricTransformations:
        - MetricNamespace: HamEats
          MetricName: MorningAlertFailed
          MetricValue: "1"
          DefaultValue: 0

  AlertsFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: hameats-morning-alert-failed
      AlarmDescription: A run of the daily favorites alerts didn't succeed. Logs are in /aws/lambda/hameats (search "alerts:").
      Namespace: HamEats
      MetricName: MorningAlertFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ProblemsTopic]

Outputs:
  SiteUrl:
    Description: The site's CloudFront address (works before your domain points here).
    Value: !Sub https://${Distribution.DomainName}
  CloudFrontDomain:
    Description: Point www.hameats.app (CNAME) and hameats.app (ALIAS/ANAME, or a redirect) here.
    Value: !GetAtt Distribution.DomainName
  FunctionUrl:
    Value: !GetAtt AppUrl.FunctionUrl
  DistributionId:
    Description: Put this in the GitHub repository variable CLOUDFRONT_DISTRIBUTION_ID.
    Value: !Ref Distribution
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
